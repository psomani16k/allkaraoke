# Self-hosted AllKaraoke. Put this file and allkaraoke.env (see allkaraoke.env.example) in one folder,
# then: docker compose up -d
#
# Open in the host firewall: TCP 3010 (the app) and UDP 40000-40199 (remote mics / online mode).
# Phones only allow microphone access over HTTPS, so serve it through your reverse proxy with a
# domain, proxying to http://<host-ip>:3010.
services:
  allkaraoke:
    image: ghcr.io/psomani16k/allkaraoke:latest
    # To build from source instead, run from a checkout of the repo with:
    # build: .
    container_name: allkaraoke
    restart: unless-stopped
    # Remote mics and online mode use WebRTC straight to this host, which needs the host's network.
    # Host networking only works on Linux (and recent Docker Desktop).
    network_mode: host
    env_file:
      - path: ./allkaraoke.env
        required: false
    volumes:
      # Leaderboard, shared songs and room state
      - allkaraoke-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  allkaraoke-data:
